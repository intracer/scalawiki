  # Key contest dates per year. Transcribed from the official rules
  # (Регламент, https://ua.wikimedia.org/wiki/Вікі_любить_Землю_<year>/Регламент,
  # clause 5.2 for both the upload window and the pictured-date limit) or, for
  # early years with no rules page, the "... in Ukraine" page on Commons.
  # Dates are ISO yyyy-MM-dd, interpreted as end-of-day in `timezone`. Consumed
  # by ContestDates via Contest.dates(year):
  #   upload-start / upload-end     -- on-wiki submission window; upload-end is
  #                                   the "accurate until" cut-off for
  #                                   --csv-cache-resync of a frozen past year.
  #   latest-allowed-pictured-date  -- general photo creation limit (wartime rule);
  #                                   replaces the old hard-coded 30 June. The
  #                                   Регламент also sets a stricter 2022-02-23
  #                                   limit for drone/aerial shots, which the code
  #                                   does not model separately.
  # Ukraine used May through 2019, then July (2020, COVID), June (2021), July
  # (2023 on). WLE was not held in Ukraine in 2022 (full-scale invasion).
  dates {
    timezone = "Europe/Kyiv"

    "2013" { upload-start = "2013-04-15", upload-end = "2013-05-15" }  # ВЛЗ-2013 pilot: "Конкурс проводиться з 15 квітня до 15 травня"
    "2014" { upload-start = "2014-05-01", upload-end = "2014-05-31" }  # Регламент 2014 п. 5.2
    "2015" { upload-start = "2015-05-01", upload-end = "2015-05-31" }  # Commons:Wiki Loves Earth 2015 in Ukraine
    "2016" { upload-start = "2016-05-01", upload-end = "2016-05-31" }  # Commons:Wiki Loves Earth 2016 in Ukraine
    "2017" { upload-start = "2017-05-01", upload-end = "2017-05-31" }  # Регламент 2017 п. 5.2
    "2018" { upload-start = "2018-05-01", upload-end = "2018-05-31" }  # Commons:Wiki Loves Earth 2018 in Ukraine
    "2019" { upload-start = "2019-05-01", upload-end = "2019-05-31" }  # Commons:Wiki Loves Earth 2019 in Ukraine
    "2020" { upload-start = "2020-07-01", upload-end = "2020-07-31" }  # Регламент 2020 п. 5.2 (shifted to July, COVID)
    "2021" { upload-start = "2021-06-01", upload-end = "2021-06-30" }  # Регламент 2021 п. 5.2
    # 2022: not held in Ukraine
    "2023" { upload-start = "2023-07-01", upload-end = "2023-07-31", latest-allowed-pictured-date = "2022-02-23" }  # Регламент 2023 пп. 5.2, 9.1
    "2024" { upload-start = "2024-07-01", upload-end = "2024-07-31", latest-allowed-pictured-date = "2024-03-31" }  # Регламент 2024 п. 5.2 (drone: 2022-02-23)
    "2025" { upload-start = "2025-07-01", upload-end = "2025-07-31", latest-allowed-pictured-date = "2025-05-31" }  # Регламент 2025 п. 5.2 (drone: 2022-02-23)
    "2026" { upload-start = "2026-07-01", upload-end = "2026-07-31", latest-allowed-pictured-date = "2026-05-31" }  # Регламент 2026 п. 5.2 (drone: 2022-02-23)
  }
}