# API:Etiquette (https://www.mediawiki.org/wiki/API:Etiquette) asks clients to make
# requests serially, not in parallel. 1024 concurrent connections to the same host
# (set in 2019, before Wikimedia's servers enforced this as strictly) now trips
# server-side rate limiting hard enough that runs regress from minutes to hours.
pekko.http.host-connection-pool.max-connections = 2