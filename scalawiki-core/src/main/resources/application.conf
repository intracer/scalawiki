pekko {
  # Send Pekko's own logging (and everything routed through `system.log`, e.g.
  # MwBot / DslQuery / WriteWatcher) through slf4j -> logback instead of the
  # default StandardOutLogger, so it lands in logs/scalawiki.log and not on the
  # console. See scalawiki-core/src/main/resources/logback.xml.
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = "INFO"
  stdout-loglevel = "OFF"
}

pekko.http.parsing {
  max-content-length = 16m
  max-to-strict-bytes = 16m
}

pekko.default-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
}