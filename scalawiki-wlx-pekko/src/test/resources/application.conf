# Disable jackson-cbor and jackson-json serialization extensions
# to avoid jackson-databind version conflicts in tests
pekko.actor.serialization-bindings {}
pekko.serialization.jackson {
  jackson-modules = []
}

pekko.persistence.journal.plugin = "pekko.persistence.testkit.journal"
pekko.persistence.snapshot-store.plugin = "pekko.persistence.testkit.snapshotstore"
